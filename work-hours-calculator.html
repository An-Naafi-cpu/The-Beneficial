<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work Hours Calculator | The Beneficial</title>
  <meta name="description" content="Calculate total work hours after breaks for free.">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; color: #173b2a; background: #f7faf7; }
    main { max-width: 700px; margin: auto; padding: 50px 20px; }
    a { color: #176b46; }
    h1 { font-size: 36px; }
    .card { background: white; padding: 26px; border-radius: 14px; margin-top: 25px; }
    label { display: block; font-weight: bold; margin-top: 18px; }
    input { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 7px; border: 1px solid #c9d8cf; border-radius: 8px; font-size: 16px; }
    button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 8px; background: #176b46; color: white; font-size: 17px; font-weight: bold; cursor: pointer; }
    #result { display: none; text-align: center; background: #e7f4eb; padding: 20px; border-radius: 10px; margin-top: 22px; }
    #total { font-size: 32px; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <a href="index.html">← Back to home</a>
    <h1>Work Hours Calculator</h1>
    <p>Calculate your total work time after subtracting your break.</p>

    <div class="card">
      <label for="start">Start time</label>
      <input id="start" type="time" value="09:00">

      <label for="end">End time</label>
      <input id="end" type="time" value="17:00">

      <label for="break">Break time in minutes</label>
      <input id="break" type="number" min="0" value="60">

      <button onclick="calculate()">Calculate work hours</button>

      <div id="result">
        <p>Your total work time:</p>
        <div id="total"></div>
      </div>
    </div>
  </main>

  <script>
    function calculate() {
      const start = document.getElementById("start").value.split(":");
      const end = document.getElementById("end").value.split(":");
      const breakMinutes = Number(document.getElementById("break").value);

      let startMinutes = Number(start[0]) * 60 + Number(start[1]);
      let endMinutes = Number(end[0]) * 60 + Number(end[1]);

      if (endMinutes < startMinutes) endMinutes += 1440;

      const totalMinutes = endMinutes - startMinutes - breakMinutes;
      if (totalMinutes < 0) return;

      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;

      document.getElementById("total").textContent = hours + " hours " + minutes + " minutes";
      document.getElementById("result").style.display = "block";
    }
  </script>
</body>
</html>
