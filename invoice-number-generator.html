<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invoice Number Generator | The Beneficial</title>

<meta name="description" content="Free invoice number generator for freelancers and small businesses. Create professional invoice numbers instantly.">

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f7faf7;
    color: #173b2a;
}

main {
    max-width: 760px;
    margin: 0 auto;
    padding: 50px 24px;
}

h1 {
    font-size: 38px;
    margin-bottom: 12px;
    text-align: center;
}

.subtitle {
    text-align: center;
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 28px;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

label {
    display: block;
    font-weight: bold;
    margin-top: 18px;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 13px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 24px;
    border: none;
    border-radius: 8px;
    background: #176b45;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #125538;
}

.result {
    display: none;
    margin-top: 28px;
    padding: 24px;
    background: #eef8f1;
    border-radius: 10px;
    text-align: center;
}

.invoice-number {
    font-size: 34px;
    font-weight: bold;
    margin: 15px 0;
}

.copy-button {
    background: white;
    color: #176b45;
    border: 1px solid #176b45;
}

.note {
    margin-top: 24px;
    font-size: 14px;
    line-height: 1.6;
    color: #555;
}
</style>
</head>

<body>

<main>

<h1>Invoice Number Generator</h1>

<p class="subtitle">
Create a professional invoice number instantly for your freelance or business invoice.
</p>

<div class="card">

<label for="prefix">Invoice Prefix</label>
<input id="prefix" type="text" value="INV">

<label for="number">Starting Number</label>
<input id="number" type="number" value="1001" min="1">

<label for="separator">Separator</label>
<input id="separator" type="text" value="-">

<button onclick="generateInvoice()">Generate Invoice Number</button>

<div class="result" id="result">

<p>Your invoice number</p>

<div class="invoice-number" id="invoiceNumber"></div>

<button class="copy-button" onclick="copyInvoice()">
Copy Invoice Number
</button>

</div>

<p class="note">
Tip: Use a consistent invoice numbering system for easier bookkeeping.
For example: INV-1001, INV-1002, INV-1003.
</p>

</div>

</main>

<script>

function generateInvoice() {

    let prefix = document.getElementById("prefix").value.trim();
    let number = document.getElementById("number").value;
    let separator = document.getElementById("separator").value;

    if (!number) {
        alert("Please enter a starting number.");
        return;
    }

    let invoiceNumber = prefix + separator + number;

    document.getElementById("invoiceNumber").textContent = invoiceNumber;

    document.getElementById("result").style.display = "block";
}

function copyInvoice() {

    let invoiceNumber =
        document.getElementById("invoiceNumber").textContent;

    navigator.clipboard.writeText(invoiceNumber);

    alert("Invoice number copied!");
}

</script>

</body>
</html>
